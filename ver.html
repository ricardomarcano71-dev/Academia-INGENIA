<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INGENIA · Clase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Nunito',Arial,sans-serif;background:#0d2b45;color:#fff}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#msg h1{font-size:28px}#msg h1 span{color:#ffc93c}
#msg p{font-size:18px;font-weight:700;color:#bcd3e6;max-width:420px}
.bar{width:260px;height:12px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
.bar div{height:100%;width:0;background:#ffc93c;transition:width .2s}
a.b{background:#ffc93c;color:#0d2b45;font-weight:900;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:17px}
#volver{position:fixed;left:8px;top:8px;z-index:5;background:rgba(13,43,69,.85);color:#fff;font-weight:900;font-size:14px;text-decoration:none;padding:6px 11px;border-radius:20px;display:none;opacity:.75}
#aviso{display:none;position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:9;background:#fff3cd;color:#5c4400;border:2px solid #ffc93c;border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
#aviso button{margin-left:6px;background:#0d2b45;color:#fff;border:0;border-radius:8px;padding:5px 10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="msg"><h1>INGE<span>NIA</span></h1><p id="t">Abriendo tu clase…</p><div class="bar"><div id="p"></div></div></div>
<iframe id="f" allow="fullscreen; autoplay" allowfullscreen></iframe>
<a id="volver" href="./">← Clases</a>
<div id="aviso"></div>
<script type="module">
const id=new URLSearchParams(location.search).get('c')||'';
const t=document.getElementById('t'),msg=document.getElementById('msg');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function aviso(r){const a=document.getElementById('aviso');a.innerHTML='⚠️ <b>Esta cuenta es personal.</b> Detectamos que se abrió en '+r.dispositivos+' dispositivos distintos esta semana. Si la compartes, podemos desactivarla. <button onclick="this.parentNode.remove()">Entendido</button>';a.style.display='block'}
function fallo(texto){t.textContent=texto;document.querySelector('.bar').remove();msg.insertAdjacentHTML('beforeend','<a class="b" href="./">Volver a las clases</a>')}
async function bajar(url){
  const r=await fetch(url);if(!r.ok)throw new Error('no');
  const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),partes=[];let n=0;
  for(;;){const {done,value}=await rd.read();if(done)break;partes.push(value);n+=value.length;if(total)document.getElementById('p').style.width=(100*n/total)+'%'}
  const out=new Uint8Array(n);let o=0;for(const p of partes){out.set(p,o);o+=p.length}return out;
}
// Formato por nivel (IG2): la llave de la clase va cifrada una vez por cada plan que puede abrirla
const COD={1:'primaria',2:'teen',3:'campus',4:'col-idea',5:'col-fatima'};
async function abrirIG2(data,llaves,D){
  if(data[0]!==73||data[1]!==71||data[2]!==50)return null;
  const n=data[3];let pos=4,k=null;
  for(let i=0;i<n;i++,pos+=61){
    const plan=COD[data[pos]],iv=data.slice(pos+1,pos+13),w=data.slice(pos+13,pos+61);
    for(const clave of (llaves[plan]||[])){
      if(k)break;
      try{
        const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
        const kp=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
        k=await crypto.subtle.decrypt({name:'AES-GCM',iv},kp,w);
      }catch(e){}
    }
  }
  if(!k)return null;
  const kc=await crypto.subtle.importKey('raw',k,'AES-GCM',false,['decrypt']);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(pos,pos+12)},kc,data.slice(pos+12));
}
(async()=>{
  if(!/^[a-z0-9-]+$/.test(id))return fallo('Esta clase no existe.');
  let D;try{D=await (await fetch('datos.json',{cache:'no-store'})).json()}catch(e){return fallo('No se pudo conectar. Revisa tu internet.')}
  const c=D.clases.find(x=>x.id===id);if(!c)return fallo('Esta clase no existe.');
  document.title='INGENIA · '+c.titulo;
  if((c.colegios||[]).length)document.getElementById('volver').href='./#colegio/'+c.colegios[0];
  if(c.gratis){location.replace('c/'+id+'.html');return}
  t.textContent='Revisando tu acceso…';
  let FB;try{FB=await import('./fb.js')}catch(e){return fallo('No se pudo conectar. Revisa tu internet.')}
  const ses=await FB.revisar(await FB.listo());
  if(ses.estado==='fuera'){location.replace('./#clases');return}
  if(ses.estado!=='ok')return fallo('Tu acceso venció. Escríbenos por WhatsApp al 0416-2054982 para renovarlo.');
  const planes=FB.planesDeClase(c);
  if(!planes.some(p=>ses.llaves&&ses.llaves[p])){
    const nom=(c.niveles||[]).length?planes.filter(p=>FB.NOMBRE_PLAN[p]).map(p=>FB.NOMBRE_PLAN[p]):[];
    (c.colegios||[]).forEach(x=>nom.push('los alumnos del '+FB.NOMBRE_COLEGIO[x]));
    return fallo('Esta clase es de '+nom.join(' o ')+' y tu plan no la incluye. Escríbenos por WhatsApp al 0416-2054982 para agregarla.')}
  const user=FB.auth.currentUser;
  FB.registrar(user,id).then(r=>{if(r&&r.compartida)aviso(r)});
  t.textContent='Abriendo “'+c.titulo+'”…';
  try{
    const data=await bajar('c/'+id+'.bin');
    t.textContent='Preparando la clase…';
    const html=await abrirIG2(data,ses.llaves||{},D);
    if(!html)throw new Error('llave');
    const f=document.getElementById('f');
    f.src=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    f.onload=()=>{msg.style.display='none';f.style.display='block';document.getElementById('volver').style.display='block'};
  }catch(e){fallo('No se pudo abrir esta clase. Avísanos por WhatsApp al 0416-2054982.')}
})();
</script>
</body>
</html>
