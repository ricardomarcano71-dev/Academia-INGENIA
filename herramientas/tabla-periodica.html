<html lang="es">

<title>Tabla periódica interactiva · INGENIA</title>
<meta name="theme-color" content="#0d2b45">
<link rel="icon" type="image/png" href="../icono-192.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d2b45;--yel:#ffc93c;--yel2:#c9971a;--ink:#1d2a3a;--soft:#4a5a6e;--bg:#f4f7fb;
 --am:#ffd6d6;--at:#ffe6c7;--mt:#ffeeb3;--pt:#d9ecc9;--md:#cdeee6;--nm:#d6e9ff;--ha:#e3dcff;--gn:#f6d9f0;--la:#e8f3d0;--ac:#f3e2cf;--un:#e6e9ee}
html,body{height:100%}
body{font-family:'Nunito',Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
header{background:var(--navy);color:#fff;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;text-decoration:none;color:#fff}.logo span{color:var(--yel)}
header h1{font-size:17px;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{display:flex;gap:6px}
.dl a{background:var(--yel);color:var(--navy);font-weight:900;font-size:14px;padding:7px 11px;border-radius:10px;text-decoration:none;white-space:nowrap}
.dl a.o{background:transparent;color:#fff;border:2px solid var(--yel)}
main{height:calc(100% - 52px);display:grid;grid-template-columns:1fr 340px;gap:12px;padding:10px 12px}
.izq{display:flex;flex-direction:column;min-width:0;min-height:0}
.modos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.modos b{font-size:14px;color:var(--soft)}
.chip{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:30px;padding:4px 11px;font-weight:900;font-size:13.5px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--navy);color:#fff}
.buscar{flex:1 1 140px;min-width:120px;padding:5px 12px;border:2px solid #cfd8e3;border-radius:30px;font:inherit;font-size:14px}
.tw{flex:1;min-height:0;display:flex}
.tabla{flex:1;min-height:0;display:grid;grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(7,1fr) .35fr repeat(2,1fr);gap:3px;position:relative}
.el{border:0;border-radius:6px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1;color:#1d2a3a;transition:transform .12s,opacity .2s;min-width:0;overflow:hidden}
.el:hover{transform:scale(1.15);z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.el.sel{outline:3px solid var(--navy);z-index:4}
.el.apagado{opacity:.18}
.el .z{position:absolute;top:2px;left:3px;font-size:clamp(6px,.75vw,10px);font-weight:800;opacity:.75}
.el .s{font-size:clamp(10px,1.45vw,22px);font-weight:900}
.el .n{font-size:clamp(5px,.62vw,9px);font-weight:700;opacity:.85;margin-top:1px;max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el.hueco{background:repeating-linear-gradient(45deg,#eef1f5,#eef1f5 4px,#e2e7ee 4px,#e2e7ee 8px);cursor:default;font-size:clamp(6px,.7vw,10px);font-weight:800;color:#6b7a8c}
.el.hueco:hover{transform:none;box-shadow:none}
.gnum{display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:900;color:#8a96a6}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12.5px;font-weight:800;color:var(--soft)}
.leyenda span{display:flex;align-items:center;gap:4px;cursor:pointer}
.leyenda i{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.escala{height:12px;width:180px;border-radius:6px;background:linear-gradient(90deg,#2b83ba,#abdda4,#ffffbf,#fdae61,#d7191c)}
/* ficha */
.ficha{background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(13,43,69,.1);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.fcab{display:flex;gap:10px;align-items:center}
.big{width:78px;height:78px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
.big .z{position:absolute;top:4px;left:6px;font-size:13px;font-weight:900}
.big .s{font-family:'Baloo 2';font-size:38px;font-weight:800;line-height:1}
.big .m{font-size:11px;font-weight:800}
.fcab h2{font-family:'Baloo 2';font-size:26px;line-height:1;color:var(--navy)}
.fcab .cat{font-size:13.5px;font-weight:800;color:var(--soft)}
.x{display:none;position:absolute;top:8px;right:10px;border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px;font-size:18px;font-weight:900;cursor:pointer}
canvas#atomo{width:100%;flex:1 1 150px;min-height:110px;max-height:240px;border-radius:14px;background:radial-gradient(circle at 50% 50%,#173a5e,#0b2236);cursor:grab;touch-action:none}
.capt{font-size:12px;font-weight:800;color:#8a96a6;text-align:center;margin-top:-3px}
.datos{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px}
.datos dt{font-weight:800;color:var(--soft)}
.datos dd{font-weight:900;color:var(--navy)}
.datos sup{font-size:.7em}
.lewis{display:flex;align-items:center;gap:12px;background:#fff8dc;border-left:5px solid var(--yel);padding:6px 10px;border-radius:10px;font-size:13.5px;font-weight:700}
.lewis canvas{width:62px;height:62px;flex:0 0 auto}
.abuela{font-size:13.5px;font-weight:700;color:#38506a;background:#eef6ff;border-radius:10px;padding:7px 10px}
.btnvoz{align-self:flex-start;border:2px solid var(--navy);background:#fff;border-radius:20px;padding:3px 10px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;color:var(--navy)}
@media(max-width:900px){
 body{overflow:hidden}
 main{grid-template-columns:1fr;padding:6px}
 header h1{font-size:15px}
 .dl a{font-size:12.5px;padding:6px 8px}
 .ficha{position:fixed;left:0;right:0;bottom:0;max-height:88%;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s;z-index:20;box-shadow:0 -10px 30px rgba(0,0,0,.3);overflow:auto}
 .ficha.on{transform:none}
 .x{display:block}
 .tabla{gap:1.5px}
 .el{border-radius:3px}
 .el .n{display:none}
 .el .s{font-size:clamp(8px,2.6vw,20px)}
 .el .z{font-size:clamp(5px,1.3vw,9px);top:1px;left:1px}
 .gnum{font-size:7px}
 .leyenda{font-size:10.5px;gap:3px 7px}
}
@media(max-width:900px) and (orientation:portrait){
 main{display:flex;flex-direction:column;gap:8px}
 .izq{flex:0 0 auto}
 .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
 .tabla{width:620px;height:370px;flex:0 0 auto}
 .el .s{font-size:15px}.el .z{font-size:7px}
 .izq:after{content:"👉 Desliza la tabla hacia los lados · gira el celular para verla completa";display:block;text-align:center;font-size:11.5px;font-weight:800;color:#8a96a6;margin-top:2px}
 .ficha{position:static;transform:none;flex:1 1 0;max-height:none;border-radius:16px;box-shadow:0 6px 18px rgba(13,43,69,.1);overflow:auto}
 .x{display:none}
 canvas#atomo{flex:0 0 190px;min-height:190px}
 .leyenda{display:none}
}
/* hoja para imprimir / imagen */
.hoja{display:none}
body.imprimir{overflow:visible;background:#fff}
body.imprimir header,body.imprimir main{display:none}
body.imprimir .hoja{display:block;width:297mm;height:210mm;padding:8mm 9mm;background:#fff;position:relative}
.hoja h1{font-family:'Baloo 2';color:var(--navy);font-size:26px;line-height:1;display:flex;justify-content:space-between;align-items:flex-end}
.hoja h1 small{font-family:'Nunito';font-size:12px;color:var(--soft);font-weight:800}
.hoja .logo2{font-family:'Baloo 2';font-weight:800}.hoja .logo2 span{color:var(--yel2)}
.ht{display:grid;grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(7,1fr) .3fr repeat(2,1fr);gap:2px;height:160mm;margin-top:4mm}
.hc{border:1px solid rgba(0,0,0,.25);border-radius:3px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.02;padding-top:6px}
.hc .z{position:absolute;top:1.5px;left:2.5px;font-size:7.5px;font-weight:900}
.hc .en{position:absolute;top:1.5px;right:2.5px;font-size:6.5px;font-weight:800;color:#555}
.hc .s{font-size:16px;font-weight:900}
.hc .n{font-size:6.3px;font-weight:800;white-space:nowrap}
.hc .m{font-size:6.5px;font-weight:700}
.hc .v{font-size:5.8px;font-weight:800;color:#7a3b00}
.hleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:9.5px;font-weight:800;margin-top:3mm;align-items:center}
.hleg i{width:11px;height:11px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.3);vertical-align:middle;margin-right:3px}
.muestra{position:absolute;left:46mm;top:14mm;width:66mm;height:26mm;display:flex;gap:6px;align-items:center;font-size:7.6px;font-weight:800;color:#38506a;line-height:1.25}
.muestra .hc{width:20mm;height:22mm;flex:0 0 auto;background:#fff}
</style>

function conf(z){const c={};let r=z;for(const o of ORD){if(r<=0)break;const k=Math.min(r,CAP[o[1]]);c[o]=k;r-=k}
 const x=EXC[z];if(x)for(const o in x)c[o]=(c[o]||0)+x[o];
 for(const o in c)if(!c[o])delete c[o];return c}
const NOB=[2,10,18,36,54,86];
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).split('').map(d=>SUP[d]).join('');
function confTxt(z,html){const c=conf(z);let core=0;for(const g of NOB)if(g<z)core=g;
 const cc=core?conf(core):{};const parts=[];for(const o of ORD)if(c[o]&&!(cc[o]===c[o]))parts.push(html?o+'<sup>'+c[o]+'</sup>':o+sup(c[o]));
 const s=E[core-1];return (core?'['+s.s+'] ':'')+parts.join(' ')}
function capas(z){const c=conf(z),k=[];for(const o in c){const n=+o[0];k[n-1]=(k[n-1]||0)+c[o]}return Array.from(k,v=>v||0)}
function valencia(e){const c=conf(e.z);const nmax=Math.max(...Object.keys(c).map(o=>+o[0]));let v=0;for(const o in c)if(+o[0]==nmax&&(o[1]=='s'||o[1]=='p'))v+=c[o];return v}
const principal=e=>e.g&&(e.g<=2||e.g>=13);
function estado(e){if(e.z>=104)return 'desconocido';return GAS.includes(e.z)?'gas':LIQ.includes(e.z)?'líquido':'sólido'}
function bloque(e){const c=conf(e.z);let last='';for(const o of ORD)if(c[o])last=o;if(e.z==2)return 's';if(e.c=='la'||e.c=='ac')return 'f';if(e.g>=3&&e.g<=12)return 'd';return last[1]}
// colores por modo
const BCOL={s:'#ffd6d6',p:'#d6e9ff',d:'#ffeeb3',f:'#d9ecc9'},SCOL={'sólido':'#e7dccb','líquido':'#bfe3ff','gas':'#f6d9f0','desconocido':'#e6e9ee'};
function enCol(v){if(v==null)return '#e6e9ee';const t=Math.min(1,Math.max(0,(v-0.7)/(3.98-0.7)));const S=[[43,131,186],[171,221,164],[255,255,191],[253,174,97],[215,25,28]];const x=t*4,i=Math.min(3,Math.floor(x)),f=x-i;const a=S[i],b=S[i+1];return `rgb(${a.map((u,j)=>Math.round(u+(b[j]-u)*f)).join(',')})`}
const MODOS={cat:'Familia',bloque:'Bloque s p d f',en:'Electronegatividad',estado:'Estado (25 °C)'};
let modo='cat',filtro=null,sel=null;
function color(e){if(modo=='cat')return `var(--${e.c})`;if(modo=='bloque')return BCOL[bloque(e)];if(modo=='en')return enCol(e.en);return SCOL[estado(e)]}
const T=document.getElementById('tabla');
function armar(){
 T.innerHTML='';
 for(let g=1;g<=18;g++){}
 E.forEach(e=>{const b=document.createElement('button');b.className='el';b.id='e'+e.z;
  const row=e.g?e.p:e.f,col=e.g||e.col+1;b.style.gridRow=row;b.style.gridColumn=col;
  b.innerHTML=`<span class="z">${e.z}</span><span class="s">${e.s}</span><span class="n">${e.n}</span>`;
  b.onclick=()=>elegir(e.z);T.appendChild(b)});
 [[6,'57–71'],[7,'89–103']].forEach(([r,t])=>{const d=document.createElement('div');d.className='el hueco';d.style.gridRow=r;d.style.gridColumn=3;d.textContent=t;T.appendChild(d)});
 const m=document.getElementById('modos');
 for(const k in MODOS){const c=document.createElement('button');c.className='chip'+(k==modo?' on':'');c.textContent=MODOS[k];c.onclick=()=>{modo=k;filtro=null;[...m.querySelectorAll('.chip')].forEach(x=>x.classList.toggle('on',x==c));pintar()};m.appendChild(c)}
 const q=document.createElement('input');q.className='buscar';q.placeholder='🔎 Buscar: oro, Fe, 26…';q.oninput=()=>buscar(q.value);m.appendChild(q);
 pintar()}
function pintar(){
 E.forEach(e=>{const b=document.getElementById('e'+e.z);b.style.background=color(e);b.classList.toggle('apagado',!!filtro&&!filtro(e))});
 const L=document.getElementById('leyenda');L.innerHTML='';
 const add=(col,txt,f)=>{const s=document.createElement('span');s.innerHTML=`<i style="background:${col}"></i>${txt}`;s.onclick=()=>{filtro=filtro&&filtro._t==txt?null:Object.assign(f,{_t:txt});pintar()};L.appendChild(s)};
 if(modo=='cat')for(const k in CAT)add(`var(--${k})`,CAT[k].replace(' (postransicional)','').replace('Propiedades aún desconocidas','Desconocido'),e=>e.c==k);
 if(modo=='bloque')for(const k in BCOL)add(BCOL[k],'Bloque '+k,e=>bloque(e)==k);
 if(modo=='estado')for(const k in SCOL)add(SCOL[k],k[0].toUpperCase()+k.slice(1),e=>estado(e)==k);
 if(modo=='en')L.innerHTML='<span>0,7 atrae poco</span><span class="escala"></span><span>3,98 atrae mucho (flúor)</span><span style="color:#8a96a6">· gris = sin dato</span>';
 if(modo!='en'){const s=document.createElement('span');s.style.color='#8a96a6';s.textContent='👆 toca un color para resaltar esa familia';L.appendChild(s)}}
function buscar(t){t=t.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
 if(!t){filtro=null;pintar();return}
 filtro=e=>String(e.z)==t||e.s.toLowerCase()==t||e.n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').startsWith(t);pintar();
 const h=E.filter(filtro);if(h.length==1)elegir(h[0].z,true)}
// ficha
function elegir(z,quieto){sel=E[z-1];document.querySelectorAll('.el.sel').forEach(x=>x.classList.remove('sel'));document.getElementById('e'+z).classList.add('sel');
 const e=sel,cp=capas(z),neu=Math.round(parseFloat(e.m.replace(/[()]/g,'').replace(',','.')))-z;
 const big=document.getElementById('big');big.style.background=`var(--${e.c})`;
 big.innerHTML=`<span class="z">${e.z}</span><span class="s">${e.s}</span><span class="m">${e.m}</span>`;
 document.getElementById('fn').textContent=e.n;
 document.getElementById('fc').textContent=CAT[e.c]+(e.g?` · Grupo ${e.g}`:'')+` · Período ${e.p}`;
 const D=[['Número atómico (Z)',`${z} → ${z} protones y ${z} electrones`],['Masa atómica',e.m+' u'+(e.m.includes('(')?' (isótopo más estable)':'')],['Neutrones (aprox.)',`${e.m.includes('(')?'≈ ':''}${neu} (masa − Z)`],['Configuración',confTxt(z,true)],['Electrones por capa',cp.join(', ')],['Electronegatividad',e.ens||'sin dato'],['Estado a 25 °C',estado(e)]];
 if(VAL[z])D.push(['Valencias comunes',VAL[z]]);
 document.getElementById('datos').innerHTML=D.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
 const lw=document.getElementById('lewis');
 if(principal(e)){lw.style.display='flex';const v=valencia(e);lewis(e.s,v);
  const falta=e.c=='gn'?0:v<=4?v:8-v;
  document.getElementById('lwt').innerHTML=`<div><b>Lewis: ${v} electrón${v==1?'':'es'} de valencia</b> (los de la última capa).<br>${e.c=='gn'?'Su capa ya está llena: no necesita enlazarse.':z==1?'Le falta 1 para tener 2 como el helio: forma 1 enlace.':v<=3?`Tiende a <b>regalar ${v}</b> y queda como ion +${v}.`:v==4?'Comparte 4: forma hasta 4 enlaces (como el carbono).':`Le faltan <b>${8-v}</b> para tener 8: tiende a ganar o compartir ${8-v}.`}</div>`}
 else lw.style.display='none';
 document.getElementById('abuela').innerHTML='👵 <b>Explicado fácil:</b> '+CATX[e.c]+(e.g?` Los del grupo ${e.g} son como hermanos: se parecen mucho porque tienen igual número de electrones afuera.`:'');
 atomo.set(cp,z,neu);
 if(!quieto&&innerWidth<=900&&innerWidth>innerHeight)document.getElementById('ficha').classList.add('on')}
function cerrar(){document.getElementById('ficha').classList.remove('on')}
function hablar(){if(!sel||!window.speechSynthesis)return;const e=sel,cp=capas(e.z);
 const t=`${e.n}. Su símbolo es ${e.s.split('').join(' ')}. Número atómico ${e.z}: tiene ${e.z} protones y ${e.z} electrones. Sus electrones se reparten en ${cp.length} capa${cp.length>1?'s':''}: ${cp.join(', ')}. Es un ${CAT[e.c].toLowerCase()}.`;
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-VE';const v=speechSynthesis.getVoices().find(v=>/es[-_](VE|MX|US|419)/i.test(v.lang))||speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));if(v)u.voice=v;u.rate=.95;speechSynthesis.speak(u)}
function lewis(s,v){const c=document.getElementById('lw'),x=c.getContext('2d');x.clearRect(0,0,124,124);
 x.font='900 46px Nunito,Arial';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#0d2b45';x.fillText(s,62,64);
 const L=[[62,22,1,0],[102,62,0,1],[62,104,1,0],[22,62,0,1]];// arriba, derecha, abajo, izquierda
 const n=[0,0,0,0];for(let i=0;i<v;i++)n[i%4]++;// primero uno en cada lado, luego se aparean
 x.fillStyle='#e0466a';n.forEach((k,i)=>{const [cx,cy,dx,dy]=L[i];for(let j=0;j<k;j++){const o=k==2?(j?7:-7):0;x.beginPath();x.arc(cx+dx*o,cy+dy*o,5,0,7);x.fill()}})}
// átomo 3D de Bohr (lienzo propio, sin librerías)
const atomo=(()=>{const c=document.getElementById('atomo'),x=c.getContext('2d');let cp=[1],Z=1,N=0,yaw=.5,pitch=.35,t=0,drag=null,auto=true,nuc=[];
 function size(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}
 function set(k,z,n){cp=k;Z=z;N=n;const tot=Math.min(z+n,40),pz=Math.round(tot*z/(z+n||1));nuc=[];
  for(let i=0;i<tot;i++){const ph=Math.acos(1-2*(i+.5)/tot),th=Math.PI*(1+Math.sqrt(5))*i;const rr=Math.cbrt(tot)*2.2;nuc.push([rr*Math.sin(ph)*Math.cos(th),rr*Math.sin(ph)*Math.sin(th),rr*Math.cos(ph),i<pz])}}
 function rot([px,py,pz]){let a=px*Math.cos(yaw)+pz*Math.sin(yaw),b=-px*Math.sin(yaw)+pz*Math.cos(yaw);let y2=py*Math.cos(pitch)-b*Math.sin(pitch),z2=py*Math.sin(pitch)+b*Math.cos(pitch);return[a,y2,z2]}
 function frame(){const r=c.getBoundingClientRect();if(c.width!=Math.round(r.width*(devicePixelRatio||1))||c.height!=Math.round(r.height*(devicePixelRatio||1)))size();const W=r.width,H=r.height;x.clearRect(0,0,W,H);
  const R=Math.min(W,H)/2-10,n=cp.length,cx=W/2,cy=H/2,step=(R-16)/n,F=400;
  const pr=p=>{const q=rot(p),s=F/(F+q[2]);return[cx+q[0]*s,cy+q[1]*s,q[2],s]};
  const items=[];
  cp.forEach((k,i)=>{const rad=16+step*(i+1),tilt=i*0.9;
   const T1=1.05,T2=i*Math.PI/Math.max(n,2);
   const pt=a=>{let px=rad*Math.cos(a),py=rad*Math.sin(a)*Math.sin(T1),pz=rad*Math.sin(a)*Math.cos(T1);return[px*Math.cos(T2)-pz*Math.sin(T2),py,px*Math.sin(T2)+pz*Math.cos(T2)]};
   x.strokeStyle='rgba(255,201,60,.35)';x.lineWidth=1.2;x.beginPath();for(let a=0;a<=6.3;a+=.1){const q=pr(pt(a));a?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}x.stroke();
   const vel=1.4/(i+1);for(let j=0;j<k;j++){const q=pr(pt(t*vel+j*2*Math.PI/k));items.push([q[2],()=>{x.fillStyle='#57c7ff';x.shadowColor='#57c7ff';x.shadowBlur=8;x.beginPath();x.arc(q[0],q[1],3.6*q[3],0,7);x.fill();x.shadowBlur=0}])}
   x.fillStyle='rgba(255,255,255,.55)';x.font='800 10px Nunito,Arial';const q=pr([rad*.72,-rad*.72,0]);x.fillText(k,q[0],q[1])});
  nuc.forEach(p=>{const q=pr(p);items.push([q[2],()=>{x.fillStyle=p[3]?'#ff6b6b':'#c7ced8';x.beginPath();x.arc(q[0],q[1],3.4*q[3],0,7);x.fill();x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=.6;x.stroke()}])});
  items.sort((a,b)=>b[0]-a[0]).forEach(i=>i[1]());
  x.font='800 11px Nunito,Arial';x.fillStyle='#ffc93c';x.textAlign='left';x.fillText(`🔴 ${Z} protones  ⚪ ${N} neutrones  🔵 ${Z} electrones`,8,H-8);x.textAlign='start';
  t+=.016;if(auto&&!drag)yaw+=.004;requestAnimationFrame(frame)}
 c.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];auto=false;c.setPointerCapture(e.pointerId)});
 c.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.01;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY]});
 c.addEventListener('pointerup',()=>drag=null);
 requestAnimationFrame(frame);return{set}})();
// hoja para imprimir (A4 horizontal)
function hoja(){const H=document.getElementById('hoja');
 let g='';for(let k=1;k<=18;k++){const r=k==1||k==18?1:(k==2||k>=13)?2:4;g+=`<div class="gnum" style="grid-row:${r};grid-column:${k};align-items:flex-start;font-size:8px;position:relative;top:-11px;height:0">${k}</div>`}
 const cells=E.map(e=>{const row=e.g?e.p:e.f,col=e.g||e.col+1;return `<div class="hc" style="grid-row:${row};grid-column:${col};background:var(--${e.c})"><span class="z">${e.z}</span><span class="en">${e.ens}</span><span class="s">${e.s}</span><span class="n">${e.n}</span><span class="m">${e.m}</span>${VAL[e.z]?`<span class="v">${VAL[e.z].replace(/ /g,'')}</span>`:''}</div>`}).join('');
 const hue=[[6,'57–71'],[7,'89–103']].map(([r,t])=>`<div class="hc" style="grid-row:${r};grid-column:3;background:#eef1f5;font-size:8px;font-weight:900">${t}</div>`).join('');
 H.innerHTML=`<h1><span>Tabla periódica de los elementos</span><small><span class="logo2">INGE<span>NIA</span></span> · Aquí sí se entiende · WhatsApp 0416-2054982</small></h1>
 <div class="ht" style="position:relative">${g}${cells}${hue}
 <div class="muestra"><div class="hc" style="background:var(--nm)"><span class="z" style="font-size:9px">6</span><span class="en" style="font-size:8px">2,55</span><span class="s" style="font-size:22px">C</span><span class="n" style="font-size:8px">Carbono</span><span class="m" style="font-size:8px">12,011</span><span class="v" style="font-size:7.5px">+2,±4</span></div>
 <div>Arriba a la izquierda: <b>número atómico</b> (protones).<br>Arriba a la derecha: <b>electronegatividad</b>.<br>Al medio: símbolo y nombre.<br>Abajo: <b>masa atómica</b> (u) y valencias comunes.<br>( ) = isótopo más estable.</div></div></div>
 <div class="hleg">${Object.keys(CAT).map(k=>`<span><i style="background:var(--${k})"></i>${CAT[k].replace(' (postransicional)','').replace('Propiedades aún desconocidas','Desconocido')}</span>`).join('')}<span style="margin-left:auto;color:#555">Gases a 25 °C: H, N, O, F, Cl y gases nobles · Líquidos: Br y Hg</span></div>`}
armar();
if(/[?&](imprimir|hoja)/.test(location.search)){document.body.classList.add('imprimir');hoja()}
else elegir(6,true);
addEventListener('keydown',e=>{if(e.key=='Escape')cerrar()});
</script>
