<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Límites notables · INGENIA</title>
<meta name="theme-color" content="#0d2b45">
<link rel="icon" type="image/png" href="../icono-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d2b45;--yel:#ffc93c;--yel2:#c9971a;--ink:#1d2a3a;--soft:#4a5a6e;--bg:#f4f7fb;--hl:#fff1a8;--azul:#1e6fd9;--rojo:#e0466a;--verde:#1f9c63;--nar:#f08c00;--mor:#7b4bd1}
html,body{height:100%}
body{font-family:'Nunito',Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
header{background:var(--navy);color:#fff;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;text-decoration:none;color:#fff}.logo span{color:var(--yel)}
header h1{font-size:17px;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{display:flex;gap:6px}
.dl a{background:var(--yel);color:var(--navy);font-weight:900;font-size:14px;padding:7px 11px;border-radius:10px;text-decoration:none;white-space:nowrap}
.dl a.o{background:transparent;color:#fff;border:2px solid var(--yel)}
main{height:calc(100% - 52px);display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:12px;padding:10px 12px}
/* fórmulas */
.f{font-family:'Nunito',serif;font-weight:800;line-height:1.5}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.92em}
.fr>i{font-style:normal;padding:0 .15em;line-height:1.15}
.fr>i:first-child{border-bottom:.09em solid currentColor}
.rz{display:inline-flex;align-items:stretch}
.rz:before{content:"√";font-size:1.1em;margin-right:-.05em}
.rz>i{font-style:normal;border-top:.09em solid currentColor;padding:0 .12em}
.f sup{font-size:.62em;vertical-align:.75em;line-height:0}
.f sub{font-size:.62em;vertical-align:-.3em;line-height:0}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin-right:.18em}
.lim>b{font-weight:800}.lim>small{font-size:.55em;font-weight:800;white-space:nowrap}
.int{display:inline-flex;align-items:center;font-size:1.35em;font-weight:400;font-family:Georgia,serif;margin-right:.05em}
.ab{display:inline-flex;flex-direction:column;font-size:.5em;line-height:1;margin-right:.15em;font-family:'Nunito'}
.c1{color:var(--azul)}.c2{color:var(--rojo)}.c3{color:var(--verde)}.c4{color:var(--nar)}.c5{color:var(--mor)}
/* lista */
.izq{display:flex;flex-direction:column;min-height:0;gap:8px}
.grupos{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:30px;padding:4px 11px;font-weight:900;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff}
.lista{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;align-content:start;padding:2px}
.it{background:#fff;border:2px solid #e2e8ef;border-radius:14px;padding:8px 10px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;transition:transform .12s,border-color .2s}
.it:hover{transform:translateY(-2px);border-color:#b9c7d6}
.it.on{border-color:var(--yel);background:#fffbea;box-shadow:0 0 0 3px rgba(255,201,60,.35)}
.it small{font-size:12px;font-weight:900;color:var(--soft)}
.it .f{font-size:16px;color:var(--navy)}
/* detalle */
.der{background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(13,43,69,.1);display:flex;flex-direction:column;min-height:0;padding:10px 14px;gap:6px;overflow:hidden}
.dt{display:flex;align-items:center;gap:10px}
.dt h2{font-family:'Baloo 2';font-size:22px;color:var(--navy);line-height:1;flex:1}
.voz{border:2px solid var(--navy);background:#fff;border-radius:20px;padding:3px 10px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;color:var(--navy)}
.big{font-size:clamp(20px,2.3vw,30px);color:var(--navy);text-align:center;padding:4px 0}
.big table{margin:0 auto;border-collapse:collapse;font-weight:800}.big td{padding:2px 10px;text-align:center}.big tr:first-child td{border-bottom:2px solid #e2e8ef}
.exp{font-size:14.5px;font-weight:700;color:#38506a;background:#eef6ff;border-radius:10px;padding:6px 10px}
.viz{flex:1;min-height:130px;display:flex;gap:8px}
.cvw{flex:1;min-width:0;position:relative}
.cvw canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;background:#fbfdff;border:1px solid #e2e8ef;touch-action:none}
.ctl{width:190px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--soft)}
.ctl label{display:flex;flex-direction:column;gap:1px}
.ctl label span{display:flex;justify-content:space-between}
.ctl label b{color:var(--navy)}
.ctl input[type=range]{width:100%;accent-color:var(--navy)}
.info{font-size:13.5px;font-weight:800;color:var(--navy);background:#fff8dc;border-radius:10px;padding:6px 8px;line-height:1.35}
.info .f{font-size:14px;white-space:normal}
.info table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.info td{padding:1px 3px;text-align:right;border-top:1px solid #f0e3b0}.info tr:first-child td{color:var(--soft);border-top:0}
.pasos{border-top:2px dashed #e2e8ef;padding-top:6px;font-size:15px;display:flex;flex-direction:column;gap:3px;max-height:34%;overflow:auto;position:relative}
.pasos .tt{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:var(--soft);font-size:13px}
.pasos .tt button{border:0;background:#eef2f7;border-radius:14px;padding:2px 10px;font:inherit;font-weight:900;font-size:12.5px;cursor:pointer;color:var(--navy)}
.pa{display:flex;gap:8px;align-items:baseline;opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s,background .4s;border-radius:8px;padding:1px 6px}
.pa.v{opacity:1;transform:none}
.pa.ac{background:var(--hl)}
.pa>em{font-style:normal;font-weight:900;color:var(--yel2);min-width:18px}
.pa .f{font-size:16px;color:var(--navy)}
.pa .n{font-family:'Caveat',cursive;font-size:19px;color:#2a5d8a;margin-left:6px}
.marc{position:absolute;width:26px;height:26px;pointer-events:none;transition:left .5s,top .5s;font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
@media(max-width:820px){
 header{height:46px;padding:0 8px;gap:6px}.logo{font-size:19px}header h1{font-size:14px}.dl a{font-size:12px;padding:5px 7px}
 main{display:flex;flex-direction:column;gap:6px;padding:6px;height:calc(100% - 46px)}
 .izq{flex:0 0 auto;gap:5px}
 .grupos{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.grupos::-webkit-scrollbar{display:none}
 .chip{font-size:12px;padding:3px 9px}
 .lista{display:flex;overflow-x:auto;overflow-y:hidden;flex:0 0 auto;gap:6px;scroll-snap-type:x mandatory;padding-bottom:3px}
 .it{flex:0 0 auto;min-width:150px;max-width:80vw;scroll-snap-align:start;padding:5px 8px}
 .it .f{font-size:14px}
 .der{flex:1 1 0;padding:8px 10px;gap:5px;border-radius:14px;overflow-y:auto}
 .der>*{flex-shrink:0}
 .dt h2{font-size:18px}
 .big{font-size:20px;padding:0}
 .exp{font-size:12.5px;padding:5px 8px}
 .viz{flex-direction:column;min-height:0;flex:0 0 auto}
 .cvw{flex:0 0 auto;height:min(46vh,230px)}
 .ctl{width:auto;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11.5px}
 .ctl .info{grid-column:1/3;font-size:12px;padding:4px 7px}
 .pasos{font-size:13px;max-height:none;overflow:visible}
 .pa .f{font-size:14px}.pa .n{font-size:16px}
}
/* hoja */
.hoja{display:none}
body.imprimir{overflow:visible;background:#fff}
body.imprimir header,body.imprimir main{display:none}
body.imprimir .hoja{display:flex;flex-direction:column;width:210mm;height:297mm;padding:9mm 10mm;background:#fff;overflow:hidden}
.hoja h1{font-family:'Baloo 2';color:var(--navy);font-size:30px;line-height:1;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--yel);padding-bottom:2mm}
.hoja h1 small{font-family:'Nunito';font-size:11px;color:var(--soft);font-weight:800;text-align:right}
.hoja .lg{font-family:'Baloo 2';font-weight:800;font-size:16px}.hoja .lg span{color:var(--yel2)}
.hcols{column-gap:5mm;margin-top:3mm;flex:1;min-height:0;column-fill:auto;overflow:hidden}
.hg{break-inside:avoid;margin-bottom:2.6mm}
.hg h3{font-family:'Baloo 2';font-size:14px;background:var(--navy);color:var(--yel);border-radius:5px;padding:0 6px;margin-bottom:1mm}
.hi{display:flex;flex-direction:column;border-bottom:1px dotted #c9d3de;padding:.6mm 1mm;break-inside:avoid}
.hi>small{font-size:.6em;font-weight:800;color:#8a96a6;order:-1;line-height:1.1;margin-bottom:-.15em}
.hi .f{color:var(--navy);white-space:normal}
.hextra{break-inside:avoid}
.hpie{text-align:center;font-family:'Caveat',cursive;font-size:20px;color:#b0790c;margin-top:1mm}
</style>
</head>
<body>
<header>
 <a class="logo" href="../herramientas.html" title="Volver a Herramientas">INGE<span>NIA</span></a>
 <h1>♾️ Límites notables</h1>
 <div class="dl"><a href="descargas/limites.png" download>🖼 Imagen</a><a class="o" href="descargas/limites.pdf" download>🖨 PDF</a></div>
</header>
<main>
 <div class="izq"><div class="grupos" id="grupos"></div><div class="lista" id="lista"></div></div>
 <div class="der">
  <div class="dt"><h2 id="dtit"></h2><button class="voz" onclick="leer()">🔊 Escuchar</button></div>
  <div class="big" id="dbig"></div>

  <div class="pasos" id="pasos"></div>
 </div>
</main>
<div class="hoja" id="hoja"></div>
<script>
// ---------- notación ----------
const fr=(a,b)=>`<span class="fr"><i>${a}</i><i>${b}</i></span>`;
const rz=a=>`<span class="rz"><i>${a}</i></span>`;
const F=s=>`<span class="f">${s}</span>`;
const lim=(a,s)=>`<span class="lim"><b>lím</b><small>${a}</small></span>${s}`;
const INT=(s,a,b)=>a!==undefined?`<span class="int">∫</span><span class="ab"><i>${b}</i><i>${a}</i></span>${s}`:`<span class="int">∫</span>${s}`;
const c=(n,s)=>`<span class="c${n}">${s}</span>`;
const num=(v,d=3)=>{if(!isFinite(v))return v>0?'∞':v<0?'−∞':'—';const r=Math.abs(v)<1e-12?0:+v.toFixed(d);return String(r).replace('-','−').replace('.',',')};
const PI=Math.PI,{sin,cos,tan,sqrt,exp,log,abs,atan,asin,acos,pow}=Math;
// ---------- lienzo ----------
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
function P(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;if(cv.width!=Math.round(r.width*d)||cv.height!=Math.round(r.height*d)){cv.width=r.width*d;cv.height=r.height*d}cx.setTransform(d,0,0,d,0,0);
 const W=r.width,H=r.height;cx.clearRect(0,0,W,H);
 const p={W,H,x:cx,xr:[-5,5],yr:[-3,3],
  ejes(xr,yr,o={}){this.xr=xr;this.yr=yr;if(o.igual){const sx=W/(xr[1]-xr[0]),sy=H/(yr[1]-yr[0]);if(sx<sy){const m=(yr[0]+yr[1])/2,h=H/sx/2;this.yr=[m-h,m+h]}else{const m=(xr[0]+xr[1])/2,w=W/sy/2;this.xr=[m-w,m+w]}}
   const X=this.X.bind(this),Y=this.Y.bind(this);const st=o.paso||paso(this.xr[1]-this.xr[0]),sty=o.pasoy||paso(this.yr[1]-this.yr[0]);
   cx.lineWidth=1;cx.strokeStyle='#e8eef5';cx.beginPath();
   for(let v=Math.ceil(this.xr[0]/st)*st;v<=this.xr[1];v+=st){cx.moveTo(X(v),0);cx.lineTo(X(v),H)}
   for(let v=Math.ceil(this.yr[0]/sty)*sty;v<=this.yr[1];v+=sty){cx.moveTo(0,Y(v));cx.lineTo(W,Y(v))}cx.stroke();
   cx.strokeStyle='#8a96a6';cx.lineWidth=1.4;cx.beginPath();cx.moveTo(0,Y(0));cx.lineTo(W,Y(0));cx.moveTo(X(0),0);cx.lineTo(X(0),H);cx.stroke();
   cx.fillStyle='#8a96a6';cx.font='700 10px Nunito,Arial';cx.textAlign='center';
   if(!o.sinNum){for(let v=Math.ceil(this.xr[0]/st)*st;v<=this.xr[1];v+=st)if(Math.abs(v)>st/2)cx.fillText(o.etx?o.etx(v):num(v,2),X(v),Math.min(H-3,Math.max(11,Y(0)+12)));
   cx.textAlign='right';for(let v=Math.ceil(this.yr[0]/sty)*sty;v<=this.yr[1];v+=sty)if(Math.abs(v)>sty/2)cx.fillText(num(v,2),Math.max(22,Math.min(W-3,X(0)-4)),Y(v)+3)}
   cx.textAlign='start';return this},
  X(v){return (v-this.xr[0])/(this.xr[1]-this.xr[0])*W},Y(v){return H-(v-this.yr[0])/(this.yr[1]-this.yr[0])*H},
  fn(f,col='#1e6fd9',w=2.6,o={}){const a=o.a??this.xr[0],b=o.b??this.xr[1];cx.strokeStyle=col;cx.lineWidth=w;cx.setLineDash(o.dash||[]);cx.beginPath();let pen=false,prev=null;
   const n=Math.max(200,W*2);for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,y=f(x);const py=this.Y(y);
    if(!isFinite(y)||Math.abs(py)>H*6||(prev!==null&&Math.abs(py-prev)>H*1.5)){pen=false;prev=isFinite(y)?py:null;continue}
    pen?cx.lineTo(this.X(x),py):cx.moveTo(this.X(x),py);pen=true;prev=py}cx.stroke();cx.setLineDash([]);return this},
  area(f,a,b,col='rgba(30,111,217,.22)',g=0){cx.fillStyle=col;cx.beginPath();cx.moveTo(this.X(a),this.Y(g));const n=200;for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;cx.lineTo(this.X(x),this.Y(f(x)))}cx.lineTo(this.X(b),this.Y(g));cx.closePath();cx.fill();return this},
  punto(x,y,col='#e0466a',r=5,hueco){cx.beginPath();cx.arc(this.X(x),this.Y(y),r,0,7);if(hueco){cx.fillStyle='#fff';cx.fill();cx.lineWidth=2.4;cx.strokeStyle=col;cx.stroke()}else{cx.fillStyle=col;cx.fill()}return this},
  seg(x1,y1,x2,y2,col='#0d2b45',w=2,dash){cx.strokeStyle=col;cx.lineWidth=w;cx.setLineDash(dash||[]);cx.beginPath();cx.moveTo(this.X(x1),this.Y(y1));cx.lineTo(this.X(x2),this.Y(y2));cx.stroke();cx.setLineDash([]);return this},
  txt(s,x,y,col='#0d2b45',o={}){cx.fillStyle=col;cx.font=`${o.peso||800} ${o.t||13}px Nunito,Arial`;cx.textAlign=o.al||'left';cx.textBaseline=o.bl||'alphabetic';cx.fillText(s,this.X(x)+(o.dx||0),this.Y(y)+(o.dy||0));cx.textAlign='start';cx.textBaseline='alphabetic';return this},
  rect(x,y,w,h,fill,stroke){cx.beginPath();cx.rect(this.X(x),this.Y(y+h),this.X(x+w)-this.X(x),this.Y(y)-this.Y(y+h));if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=1.5;cx.stroke()}return this}};
 return p}
function paso(r){const t=r/8,e=Math.pow(10,Math.floor(Math.log10(t))),m=t/e;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e}
// ---------- datos de la herramienta ----------
// TITULO: Límites notables
// ICONO: ♾️
// límite cuando x → a: dos puntos se acercan por la izquierda y por la derecha
const VL=(f,a,L,o={})=>({sl:[{k:'k',l:'Acercarse a '+(o.an||num(a)),min:0,max:3,st:.05,v:.3,fmt:v=>'h = '+num(10**-v,4)}],d(p,s){const h=10**-s.k,xr=o.xr||[a-4,a+4],yr=o.yr||[L-3,L+3];
 p.ejes(xr,yr,o.ej||{});p.seg(xr[0],L,xr[1],L,'#f08c00',1.3,[5,4]);p.seg(a,yr[0],a,yr[1],'#c9971a',1.1,[3,4]);p.fn(f,'#1e6fd9',3);
 const y1=f(a-h),y2=f(a+h);p.punto(a,L,'#e0466a',6,true);if(o.lat!='der')p.punto(a-h,y1,'#1f9c63',6);if(o.lat!='izq')p.punto(a+h,y2,'#7b4bd1',6);
 p.txt('L = '+(o.Ln||num(L,4)),xr[1],L,'#f08c00',{al:'right',dy:-6,dx:-4});
 const fil=[1,.1,.01,.001].map(t=>`<tr><td>${num(t,3)}</td><td>${o.lat=='der'?'':num(f(a-t),4)}</td><td>${o.lat=='izq'?'':num(f(a+t),4)}</td></tr>`).join('');
 return `<span class="c3">por la izquierda: ${o.lat=='der'?'—':num(y1,5)}</span><br><span class="c5">por la derecha: ${o.lat=='izq'?'—':num(y2,5)}</span><br>Se acercan a <b>${o.Ln||num(L,4)}</b><table style="font-size:11.5px;margin-top:4px;border-collapse:collapse" cellpadding="1"><tr><td>h</td><td>a − h</td><td>a + h</td></tr>${fil}</table>`}});
// límite cuando x → ∞
const VInf=(f,L,o={})=>({sl:[{k:'x',l:'x crece',min:0,max:4,st:.02,v:1,fmt:v=>'x = '+num(10**v,0)}],d(p,s){const x=10**s.x,xr=o.xr||[0,30],yr=o.yr||[L-2,L+2];
 p.ejes(xr,yr);p.seg(xr[0],L,xr[1],L,'#f08c00',1.5,[5,4]);p.fn(f,'#1e6fd9',3,{a:o.a??.05});const xx=Math.min(x,xr[1]);p.punto(xx,f(xx),'#7b4bd1',6);
 p.txt('L = '+(o.Ln||num(L,4)),xr[1],L,'#f08c00',{al:'right',dy:-6,dx:-4});
 const fil=[10,100,1000,10000].map(t=>`<tr><td>${num(t,0)}</td><td>${num(f(t),5)}</td></tr>`).join('');
 return `x = ${num(x,0)} → f(x) = <b>${num(f(x),5)}</b><br>Mientras más grande es x, más se acerca a <b>${o.Ln||num(L,4)}</b><table style="font-size:11.5px;margin-top:4px" cellpadding="1"><tr><td>x</td><td>f(x)</td></tr>${fil}</table>`}});
const E=Math.E,x0='x → 0',xi='x → ∞';
const TOOL={hoja:{cols:2,fs:17},grupos:[
{n:'Trigonométricos',items:[
 {t:'El límite más famoso',f:`${lim(x0,fr('sen x','x'))} = 1`,x:'Cuando el ángulo es muy chiquito (en radianes), el seno y el ángulo son casi iguales: un arco muy pequeño casi no se distingue de su cuerda. Por eso su cociente se acerca a 1, aunque en x = 0 la fracción no existe (0/0).',v:VL(x=>sin(x)/x,0,1,{yr:[-.6,1.6],xr:[-8,8]}),ejt:fr('sen 3x','x'),ej:[[lim(x0,fr('sen 3x','x'))+' = '+lim(x0,'3 · '+fr('sen 3x','3x')),'multiplico y divido entre 3'],['= 3 · 1 = 3','✔']]},
