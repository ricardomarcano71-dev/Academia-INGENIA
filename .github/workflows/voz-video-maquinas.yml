name: Voz de los videos de máquinas
on:
  push:
    branches: ['voz-video-maquinas']
    paths: ['voz-video-maquinas/textos.json', 'voz-video-maquinas/generar.py', '.github/workflows/voz-video-maquinas.yml']
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Generar audios
        run: |
          pip install -q edge-tts
          python3 voz-video-maquinas/generar.py
      - name: Guardar audios en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voz-video-maquinas/audio
          git commit -m "Audios de la narración" || echo "sin cambios"
          git push
